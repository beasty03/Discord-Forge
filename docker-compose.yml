services:
  discordforge:
    build: .
    ports:
      - "5000:5000"
    restart: always
    env_file:
      - app/.env
    volumes:
      - ./data:/discordforge/data
      # Mount Docker socket so the app can manage bot containers (BOT_RUNNER=docker only)
      - /var/run/docker.sock:/var/run/docker.sock
