<body>
<div class="nav"><a href="index.html">Deployment Inspector</a><span class="nav-sep">/</span><a href="func_index.html">Function Tests</a><span class="nav-sep">/</span><span>Step 8 — Roles</span></div>
<h1>Step 8 &mdash; Roles</h1>
<p class="sub">Compare configured roles against live Discord guild roles.</p>

<div class="server-selector">
  <label style="font-size:.85rem;color:#8b949e">Server:</label>
  <select id="serverSelect" onchange="saveServer()"><option value="">— select —</option></select>
  <button class="btn" id="runBtn" onclick="runCheck()">Check Roles</button>
</div>

<div id="output"><div class="empty-state">Select a server and click "Check Roles".</div></div>

<div class="footer-nav">
  <a class="btn-prev" href="func_step7_assets.html">&larr; Back: Assets</a>
  <a class="btn-done" href="func_index.html">&#x2713; Back to Function Tests Hub</a>
</div>

<script>
const F=window.location.origin;

async function loadServers(){
  const sel=document.getElementById('serverSelect');
  try{
    const r=await fetch(F+'/api/servers/list',{redirect:'manual',signal:AbortSignal.timeout(5000)});
    if(r.type==='opaqueredirect'||[302,303,401].includes(r.status)){sel.innerHTML='<option value="">— Please log in first —</option>';if(!document.getElementById('_loginBtn')){const a=document.createElement('a');a.id='_loginBtn';a.href=F+'/login?next='+encodeURIComponent(window.location.pathname);a.textContent='Log in';a.style.cssText='margin-left:8px;background:#238636;color:#fff;border-radius:7px;padding:9px 20px;font-size:.875rem;font-weight:600;text-decoration:none;display:inline-block;';sel.parentNode.insertBefore(a,sel.nextSibling);const b=document.createElement('button');b.id='_refreshBtn';b.textContent='↻ Refresh';b.onclick=loadServers;b.style.cssText='margin-left:8px;background:#21262d;color:#c9d1d9;border:none;border-radius:7px;padding:9px 14px;font-size:.875rem;font-weight:600;cursor:pointer;';a.parentNode.insertBefore(b,a.nextSibling);}return;}
    const data=await r.json();
    const servers=data.servers||data||[];
    sel.innerHTML='<option value="">— select —</option>';
    servers.forEach(s=>{
      const opt=document.createElement('option');
      opt.value=s.server_id||s.id||s.name;
      opt.textContent=s.server_name||s.name||(s.server_id||s.id);
      sel.appendChild(opt);
    });
    const saved=localStorage.getItem('func_test_server_id');
    if(saved) for(let i=0;i<sel.options.length;i++) if(sel.options[i].value===saved){sel.selectedIndex=i;break;}
  }catch(e){sel.innerHTML='<option value="">— Flask unreachable —</option>';}
}

function saveServer(){
  const v=document.getElementById('serverSelect').value;
  if(v) localStorage.setItem('func_test_server_id',v);
}

function hexColor(c){
  if(!c||c==='#99aab5'||c==='0'||c===0) return '#99aab5';
  if(typeof c==='number') return '#'+c.toString(16).padStart(6,'0');
  return c;
}

async function runCheck(){
  const sid=document.getElementById('serverSelect').value;
  if(!sid){alert('Select a server first.');return;}
  const btn=document.getElementById('runBtn');
  const out=document.getElementById('output');
  btn.disabled=true;
  out.innerHTML='<div class="empty-state">Checking roles…</div>';

  try{
    const r=await fetch(`${F}/api/func-test/roles/${encodeURIComponent(sid)}`,{
      redirect:'manual',signal:AbortSignal.timeout(12000)
    });
    if(r.type==='opaqueredirect'||[302,303,401].includes(r.status)){
      out.innerHTML='<div class="empty-state">Login required.</div>';btn.disabled=false;return;
    }
    if(!r.ok){
      let errText='HTTP '+r.status;
      try{const e=await r.clone().json();errText=e.error||errText;}catch(x){}
      out.innerHTML=`<div class="empty-state" style="color:#f85149">${escHtml(errText)}</div>`;
      btn.disabled=false;return;
    }
    const d=await r.json();

    const missing=(d.roles||[]).filter(r=>!r.live).length;
    if(missing>0) autoLogIssue(`Roles missing: ${missing} role(s)`,
      `Configured roles not found on Discord: ${missing} missing`,'ROLE_MISSING',`/api/func-test/roles/${sid}`,'medium');

    let html=`<div class="summary-bar">
      <div class="sbox"><div class="sbox-num">${d.configured_count}</div><div class="sbox-lbl">Configured</div></div>
      <div class="sbox"><div class="sbox-num" style="color:#56d364">${d.live_count}</div><div class="sbox-lbl">Live</div></div>
      <div class="sbox"><div class="sbox-num" style="color:${missing>0?'#f85149':'#56d364'}">${missing}</div><div class="sbox-lbl">Missing</div></div>
    </div>`;

    if(d.configured_count===0){
      html+=`<div class="info-box"><strong>No custom roles configured</strong> — no roles were set up for this server. You can add them in the server setup form.</div>`;
    }

    // Configured roles table
    if((d.roles||[]).length>0){
      html+=`<div class="card"><div class="card-title">Configured Roles</div>
        <table>
          <thead><tr><th>Name</th><th>Color</th><th>Hoist</th><th>Permissions</th><th>Status</th></tr></thead>
          <tbody>${d.roles.map(r=>{
            const hex=hexColor(r.color);
            const perms=(r.permissions||[]).map(p=>`<span class="perm-tag">${escHtml(p)}</span>`).join('');
            return `<tr>
              <td style="font-weight:600">${escHtml(r.name)}</td>
              <td><span class="color-swatch" style="background:${escHtml(hex)}"></span><code>${escHtml(hex)}</code></td>
              <td>${r.hoist?'<span style="color:#56d364">yes</span>':'<span style="color:#484f58">no</span>'}</td>
              <td>${perms||'<span style="color:#484f58">—</span>'}</td>
              <td>${r.live?'<span class="ok">✓ Live</span>':'<span class="fail">✗ Missing</span>'}</td>
            </tr>`;
          }).join('')}
          </tbody>
        </table>
      </div>`;
    }

    // Extra live roles
    if((d.extra_live||[]).length>0){
      html+=`<div class="card"><div class="card-title">Extra Roles on Discord <span style="font-size:.8rem;color:#8b949e;font-weight:400">(not in config)</span></div>
        <div style="margin-bottom:8px;font-size:.82rem;color:#8b949e">These roles exist on Discord but were not part of the server setup configuration.</div>
        <div>${d.extra_live.map(r=>`<span class="extra-tag">${escHtml(r.name)}</span>`).join('')}</div>
      </div>`;
    }

    // All live roles
    if((d.live_all||[]).length>0){
      html+=`<div class="card"><div class="card-title">All Discord Roles</div>
        <table>
          <thead><tr><th>Name</th><th>Position</th><th>Managed</th></tr></thead>
          <tbody>${d.live_all.map(r=>`<tr>
            <td>${escHtml(r.name)}${r.managed?'<span class="managed-tag">bot</span>':''}</td>
            <td style="color:#484f58">${r.position}</td>
            <td>${r.managed?'<span style="color:#f85149">yes</span>':'<span style="color:#484f58">no</span>'}</td>
          </tr>`).join('')}</tbody>
        </table>
      </div>`;
    }

    out.innerHTML=html;
  }catch(e){
    out.innerHTML=`<div class="empty-state" style="color:#f85149">Error: ${escHtml(e.message)}</div>`;
  }
  btn.disabled=false;
}

function autoLogIssue(title,description,code,url,sev){
  const issues=JSON.parse(localStorage.getItem('stress_test_issues')||'[]');
  if(issues.find(i=>i.title===title&&i.url===url&&(Date.now()-new Date(i.created).getTime())<300000)) return;
  issues.unshift({id:Date.now()+Math.random(),title,severity:sev,area:'func-roles',description,steps:'',code:String(code||''),url,created:new Date().toISOString(),auto:true});
  localStorage.setItem('stress_test_issues',JSON.stringify(issues));
}

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
loadServers();
</script>
</body>
</html>
