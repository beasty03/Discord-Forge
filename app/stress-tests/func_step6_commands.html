<body>
<div class="nav"><a href="index.html">Deployment Inspector</a><span class="nav-sep">/</span><a href="func_index.html">Function Tests</a><span class="nav-sep">/</span><span>Step 6 — Commands</span></div>
<h1>Step 6 &mdash; Slash Commands</h1>
<p class="sub">List all slash commands registered with Discord for this guild via the Discord API.</p>

<div class="server-selector">
  <label style="font-size:.85rem;color:#8b949e">Server:</label>
  <select id="serverSelect" onchange="saveServer()"><option value="">— select —</option></select>
  <button class="btn" id="runBtn" onclick="runCheck()">Fetch Commands</button>
</div>

<div id="output"><div class="empty-state">Select a server and click "Fetch Commands".</div></div>

<div class="footer-nav">
  <a class="btn-prev" href="func_step5_scripts.html">&larr; Back: Scripts</a>
  <a class="btn-next" href="func_step7_assets.html">Next: Assets &rarr;</a>
</div>

<script>
const F=window.location.origin;
let allCommands=[];

async function loadServers(){
  const sel=document.getElementById('serverSelect');
  try{
    const r=await fetch(F+'/api/servers/list',{redirect:'manual',signal:AbortSignal.timeout(5000)});
    if(r.type==='opaqueredirect'||[302,303,401].includes(r.status)){sel.innerHTML='<option value="">— Please log in first —</option>';if(!document.getElementById('_loginBtn')){const a=document.createElement('a');a.id='_loginBtn';a.href=F+'/login?next='+encodeURIComponent(window.location.pathname);a.textContent='Log in';a.style.cssText='margin-left:8px;background:#238636;color:#fff;border-radius:7px;padding:9px 20px;font-size:.875rem;font-weight:600;text-decoration:none;display:inline-block;';sel.parentNode.insertBefore(a,sel.nextSibling);const b=document.createElement('button');b.id='_refreshBtn';b.textContent='↻ Refresh';b.onclick=loadServers;b.style.cssText='margin-left:8px;background:#21262d;color:#c9d1d9;border:none;border-radius:7px;padding:9px 14px;font-size:.875rem;font-weight:600;cursor:pointer;';a.parentNode.insertBefore(b,a.nextSibling);}return;}
    const data=await r.json();
    const servers=data.servers||data||[];
    sel.innerHTML='<option value="">— select —</option>';
    servers.forEach(s=>{
      const opt=document.createElement('option');
      opt.value=s.server_id||s.id||s.name;
      opt.textContent=s.name||(s.server_id||s.id);
      sel.appendChild(opt);
    });
    const saved=localStorage.getItem('func_test_server_id');
    if(saved) for(let i=0;i<sel.options.length;i++) if(sel.options[i].value===saved){sel.selectedIndex=i;break;}
  }catch(e){sel.innerHTML='<option value="">— Flask unreachable —</option>';}
}

function saveServer(){
  const v=document.getElementById('serverSelect').value;
  if(v) localStorage.setItem('func_test_server_id',v);
}

function filterCommands(){
  const q=(document.getElementById('cmd-search')?.value||'').toLowerCase();
  const visible=q?allCommands.filter(c=>c.name.includes(q)||(c.description||'').toLowerCase().includes(q)):allCommands;
  const tbody=document.getElementById('cmd-body');
  if(tbody) tbody.innerHTML=visible.map(c=>`<tr>
    <td><span class="cmd-name">/${escHtml(c.name)}</span></td>
    <td style="color:#8b949e">${escHtml(c.description||'—')}</td>
    <td style="color:#484f58;font-size:.78rem">${c.options_count} option(s)</td>
    <td style="color:#484f58;font-size:.75rem;font-family:monospace">${escHtml(c.id)}</td>
  </tr>`).join('');
}

async function runCheck(){
  const sid=document.getElementById('serverSelect').value;
  if(!sid){alert('Select a server first.');return;}
  const btn=document.getElementById('runBtn');
  const out=document.getElementById('output');
  btn.disabled=true;
  out.innerHTML='<div class="empty-state">Fetching commands from Discord…</div>';

  try{
    const r=await fetch(`${F}/api/func-test/commands/${encodeURIComponent(sid)}`,{
      redirect:'manual',signal:AbortSignal.timeout(12000)
    });
    if(r.type==='opaqueredirect'||[302,303,401].includes(r.status)){
      out.innerHTML='<div class="empty-state">Login required.</div>';btn.disabled=false;return;
    }
    if(!r.ok){
      let errText='HTTP '+r.status;
      try{const e=await r.clone().json();errText=e.error||errText;}catch(x){}
      out.innerHTML=`<div class="empty-state" style="color:#f85149">${escHtml(errText)}</div>`;
      btn.disabled=false;return;
    }
    const d=await r.json();

    if(!d.ok){
      let extra='';
      if(d.error&&d.error.includes('application_id')){
        extra=`<div class="warn-box" style="margin-top:12px"><strong>Tip:</strong> Set the <code>application_id</code> field on the bot in your server config. This is the Discord Application ID (found in the Developer Portal).</div>`;
      }
      out.innerHTML=`<div class="empty-state" style="color:#f85149">${escHtml(d.error||'Error')} (HTTP ${d.discord_status||'?'})</div>${extra}`;
      btn.disabled=false;return;
    }

    allCommands=d.commands||[];

    if(allCommands.length===0){
      out.innerHTML=`<div class="card">
        <div class="empty-state" style="padding:16px">No slash commands registered for this guild.</div>
        <div style="font-size:.82rem;color:#8b949e;margin-top:8px">The bot needs to sync its commands using <code>bot.tree.sync(guild=...)</code> or a <code>/sync</code> command.</div>
      </div>`;
      btn.disabled=false;return;
    }

    let html=`<div class="summary-bar">
      <div class="sbox"><div class="sbox-num" style="color:#a371f7">${d.total}</div><div class="sbox-lbl">Commands</div></div>
    </div>
    <div class="card">
      <div class="card-title">Registered Commands</div>
      <input class="search-box" id="cmd-search" placeholder="Filter commands…" oninput="filterCommands()">
      <table>
        <thead><tr><th>Command</th><th>Description</th><th>Options</th><th>ID</th></tr></thead>
        <tbody id="cmd-body"></tbody>
      </table>
    </div>`;

    out.innerHTML=html;
    filterCommands();
  }catch(e){
    out.innerHTML=`<div class="empty-state" style="color:#f85149">Error: ${escHtml(e.message)}</div>`;
  }
  btn.disabled=false;
}

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
loadServers();
</script>
</body>
</html>
