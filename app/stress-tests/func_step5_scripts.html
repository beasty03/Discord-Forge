<head>

<title>Func Step 5 — Installed Scripts</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}

<body>
<div class="nav"><a href="index.html">Deployment Inspector</a><span class="nav-sep">/</span><a href="func_index.html">Function Tests</a><span class="nav-sep">/</span><span>Step 5 — Scripts</span></div>
<h1>Step 5 &mdash; Installed Scripts</h1>
<p class="sub">Verify which cogs and scripts are installed per bot.</p>

<div class="server-selector">
  <label style="font-size:.85rem;color:#8b949e">Server:</label>
  <select id="serverSelect" onchange="saveServer()"><option value="">— select —</option></select>
  <button class="btn" id="runBtn" onclick="runCheck()">Load Scripts</button>
</div>

<div id="output"><div class="empty-state">Select a server and click "Load Scripts".</div></div>

<div class="footer-nav">
  <a class="btn-prev" href="func_step4_permissions.html">&larr; Back: Permissions</a>
  <a class="btn-next" href="func_step6_commands.html">Next: Slash Commands &rarr;</a>
</div>

<script>
const F=window.location.origin;

async function loadServers(){
  const sel=document.getElementById('serverSelect');
  try{
    const r=await fetch(F+'/api/servers/list',{redirect:'manual',signal:AbortSignal.timeout(5000)});
    if(r.type==='opaqueredirect'||[302,303,401].includes(r.status)){sel.innerHTML='<option value="">— Please log in first —</option>';if(!document.getElementById('_loginBtn')){const a=document.createElement('a');a.id='_loginBtn';a.href=F+'/login?next='+encodeURIComponent(window.location.pathname);a.textContent='Log in';a.style.cssText='margin-left:8px;background:#238636;color:#fff;border-radius:7px;padding:9px 20px;font-size:.875rem;font-weight:600;text-decoration:none;display:inline-block;';sel.parentNode.insertBefore(a,sel.nextSibling);const b=document.createElement('button');b.id='_refreshBtn';b.textContent='↻ Refresh';b.onclick=loadServers;b.style.cssText='margin-left:8px;background:#21262d;color:#c9d1d9;border:none;border-radius:7px;padding:9px 14px;font-size:.875rem;font-weight:600;cursor:pointer;';a.parentNode.insertBefore(b,a.nextSibling);}return;}
    const data=await r.json();
    const servers=data.servers||data||[];
    sel.innerHTML='<option value="">— select —</option>';
    servers.forEach(s=>{
      const opt=document.createElement('option');
      opt.value=s.server_id||s.id||s.name;
      opt.textContent=s.name||(s.server_id||s.id);
      sel.appendChild(opt);
    });
    const saved=localStorage.getItem('func_test_server_id');
    if(saved) for(let i=0;i<sel.options.length;i++) if(sel.options[i].value===saved){sel.selectedIndex=i;break;}
  }catch(e){sel.innerHTML='<option value="">— Flask unreachable —</option>';}
}

function saveServer(){
  const v=document.getElementById('serverSelect').value;
  if(v) localStorage.setItem('func_test_server_id',v);
}

async function runCheck(){
  const sid=document.getElementById('serverSelect').value;
  if(!sid){alert('Select a server first.');return;}
  const btn=document.getElementById('runBtn');
  const out=document.getElementById('output');
  btn.disabled=true;
  out.innerHTML='<div class="empty-state">Loading…</div>';

  try{
    // Use existing endpoint
    const r=await fetch(`${F}/api/bots/installed-cogs/${encodeURIComponent(sid)}`,{
      redirect:'manual',signal:AbortSignal.timeout(8000)
    });
    if(r.type==='opaqueredirect'||[302,303,401].includes(r.status)){
      out.innerHTML='<div class="empty-state">Login required.</div>';btn.disabled=false;return;
    }
    if(!r.ok){
      let errText='HTTP '+r.status;
      try{const e=await r.clone().json();errText=e.error||errText;}catch(x){}
      out.innerHTML=`<div class="empty-state" style="color:#f85149">${escHtml(errText)}</div>`;
      btn.disabled=false;return;
    }
    const d=await r.json();
    if(d.error){
      out.innerHTML=`<div class="empty-state" style="color:#f85149">${escHtml(d.error)}</div>`;
      btn.disabled=false;return;
    }

    // d is typically {bots: [{name, cogs:[], scripts:[]}]} or similar
    const bots=d.bots||Object.entries(d).map(([name,v])=>({name,...v}));

    if(!bots||bots.length===0){
      out.innerHTML='<div class="empty-state">No bots or scripts found.</div>';
      btn.disabled=false;return;
    }

    const totalCogs=bots.reduce((a,b)=>a+(b.cogs?.length||0),0);
    const totalScripts=bots.reduce((a,b)=>a+(b.scripts?.length||0),0);

    let html=`<div class="summary-bar">
      <div class="sbox"><div class="sbox-num">${bots.length}</div><div class="sbox-lbl">Bots</div></div>
      <div class="sbox"><div class="sbox-num" style="color:#58a6ff">${totalCogs}</div><div class="sbox-lbl">Cogs</div></div>
      <div class="sbox"><div class="sbox-num" style="color:#56d364">${totalScripts}</div><div class="sbox-lbl">Scripts</div></div>
    </div>`;

    html+=`<div class="card"><div class="card-title">Per-Bot Details</div>`;
    bots.forEach(bot=>{
      const cogs=bot.cogs||[];
      const scripts=bot.scripts||[];
      html+=`<div class="bot-section">
        <div class="bot-header">${escHtml(bot.name||'Unknown')}</div>
        ${cogs.length?`<div class="type-label">Cogs (${cogs.length})</div><div>${cogs.map(c=>`<span class="cog-tag">${escHtml(c)}</span>`).join('')}</div>`:'<div style="font-size:.8rem;color:#484f58">No cogs installed</div>'}
        ${scripts.length?`<div class="type-label" style="margin-top:8px">Scripts (${scripts.length})</div><div>${scripts.map(s=>`<span class="script-tag">${escHtml(s)}</span>`).join('')}</div>`:''}
      </div>`;
    });
    html+='</div>';

    out.innerHTML=html;
  }catch(e){
    out.innerHTML=`<div class="empty-state" style="color:#f85149">Error: ${escHtml(e.message)}</div>`;
  }
  btn.disabled=false;
}

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
loadServers();
</script>
</body>
</html>
