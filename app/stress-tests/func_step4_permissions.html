<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Func Step 4 — Bot Permissions</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0d1117;color:#c9d1d9;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;padding:28px 24px}
  .nav{display:flex;align-items:center;gap:12px;margin-bottom:24px;font-size:.83rem;color:#8b949e}
  .nav a{color:#58a6ff;text-decoration:none}.nav a:hover{text-decoration:underline}
  .nav-sep{color:#30363d}
  h1{font-size:1.45rem;font-weight:700;color:#f0f6fc}
  .sub{color:#8b949e;font-size:.85rem;margin:4px 0 24px}
  .card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:20px;margin-bottom:16px}
  .card-title{font-weight:600;color:#f0f6fc;margin-bottom:12px;font-size:.95rem}
  .btn{background:#6e40c9;color:#fff;border:none;border-radius:7px;padding:9px 20px;font-size:.875rem;font-weight:600;cursor:pointer;transition:background .15s}
  .btn:hover{background:#a371f7}.btn:disabled{background:#21262d;color:#484f58;cursor:not-allowed}
  .footer-nav{display:flex;justify-content:space-between;margin-top:24px;flex-wrap:wrap;gap:10px}
  .btn-next{background:#1f6feb;color:#fff;border:none;border-radius:7px;padding:9px 20px;font-size:.875rem;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
  .btn-next:hover{background:#388bfd}
  .btn-prev{background:#21262d;color:#c9d1d9;border:none;border-radius:7px;padding:9px 20px;font-size:.875rem;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
  .btn-prev:hover{background:#30363d}
  code{background:#21262d;padding:1px 5px;border-radius:4px;font-size:.8rem;font-family:monospace}
  .server-selector{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
  select{background:#21262d;border:1px solid #30363d;border-radius:6px;padding:6px 10px;color:#c9d1d9;font-size:.85rem;outline:none;min-width:200px}
  select:focus{border-color:#a371f7}
  .empty-state{text-align:center;padding:32px;color:#484f58;font-size:.9rem}
  .perm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:4px}
  .perm-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#0d1117;border:1px solid #21262d;border-radius:7px;font-size:.83rem}
  .perm-name{flex:1;color:#c9d1d9}
  .perm-ok{color:#56d364;font-weight:700}
  .perm-fail{color:#f85149;font-weight:700}
  .perm-critical{border-color:#f85149}
  .admin-banner{text-align:center;padding:16px;font-size:1.1rem;font-weight:700;color:#56d364;background:#1a3d26;border:1px solid #238636;border-radius:8px;margin-bottom:16px}
  .kv-row{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #21262d;font-size:.82rem}

  .kv-val{color:#f0f6fc;font-family:monospace}
</style>

<body>
<div class="nav"><a href="index.html">Deployment Inspector</a><span class="nav-sep">/</span><a href="func_index.html">Function Tests</a><span class="nav-sep">/</span><span>Step 4 — Permissions</span></div>
<h1>Step 4 &mdash; Bot Permissions</h1>
<p class="sub">Check the bot's computed guild permissions against required capabilities.</p>

<div class="server-selector">
  <label style="font-size:.85rem;color:#8b949e">Server:</label>
  <select id="serverSelect" onchange="saveServer()"><option value="">— select —</option></select>
  <button class="btn" id="runBtn" onclick="runCheck()">Check Permissions</button>
</div>

<div id="output"><div class="empty-state">Select a server and click "Check Permissions".</div></div>

<div class="footer-nav">
  <a class="btn-prev" href="func_step3_channels.html">&larr; Back: Channels</a>
  <a class="btn-next" href="func_step5_scripts.html">Next: Scripts &rarr;</a>
</div>

<script>
const F=window.location.origin;
const CRITICAL=['VIEW_CHANNEL','SEND_MESSAGES','USE_APPLICATION_COMMANDS'];
const PERM_LABELS={
  ADMINISTRATOR:'Administrator',
  VIEW_CHANNEL:'View Channel',
  SEND_MESSAGES:'Send Messages',
  MANAGE_MESSAGES:'Manage Messages',
  EMBED_LINKS:'Embed Links',
  READ_MESSAGE_HISTORY:'Read Message History',
  USE_APPLICATION_COMMANDS:'Use App Commands',
  MANAGE_ROLES:'Manage Roles',
  MANAGE_CHANNELS:'Manage Channels',
  KICK_MEMBERS:'Kick Members',
  BAN_MEMBERS:'Ban Members',
};

async function loadServers(){
  const sel=document.getElementById('serverSelect');
  try{
    const r=await fetch(F+'/api/servers/list',{redirect:'manual',signal:AbortSignal.timeout(5000)});
    if(r.type==='opaqueredirect'||[302,303,401].includes(r.status)){sel.innerHTML='<option value="">— Please log in first —</option>';if(!document.getElementById('_loginBtn')){const a=document.createElement('a');a.id='_loginBtn';a.href=F+'/login?next='+encodeURIComponent(window.location.pathname);a.textContent='Log in';a.style.cssText='margin-left:8px;background:#238636;color:#fff;border-radius:7px;padding:9px 20px;font-size:.875rem;font-weight:600;text-decoration:none;display:inline-block;';sel.parentNode.insertBefore(a,sel.nextSibling);const b=document.createElement('button');b.id='_refreshBtn';b.textContent='↻ Refresh';b.onclick=loadServers;b.style.cssText='margin-left:8px;background:#21262d;color:#c9d1d9;border:none;border-radius:7px;padding:9px 14px;font-size:.875rem;font-weight:600;cursor:pointer;';a.parentNode.insertBefore(b,a.nextSibling);}return;}
    const data=await r.json();
    const servers=data.servers||data||[];
    sel.innerHTML='<option value="">— select —</option>';
    servers.forEach(s=>{
      const opt=document.createElement('option');
      opt.value=s.server_id||s.id||s.name;
      opt.textContent=s.name||(s.server_id||s.id);
      sel.appendChild(opt);
    });
    const saved=localStorage.getItem('func_test_server_id');
    if(saved) for(let i=0;i<sel.options.length;i++) if(sel.options[i].value===saved){sel.selectedIndex=i;break;}
  }catch(e){sel.innerHTML='<option value="">— Flask unreachable —</option>';}
}

function saveServer(){
  const v=document.getElementById('serverSelect').value;
  if(v) localStorage.setItem('func_test_server_id',v);
}

async function runCheck(){
  const sid=document.getElementById('serverSelect').value;
  if(!sid){alert('Select a server first.');return;}
  const btn=document.getElementById('runBtn');
  const out=document.getElementById('output');
  btn.disabled=true;
  out.innerHTML='<div class="empty-state">Checking permissions…</div>';

  try{
    const r=await fetch(`${F}/api/func-test/permissions/${encodeURIComponent(sid)}`,{
      redirect:'manual',signal:AbortSignal.timeout(15000)
    });
    if(r.type==='opaqueredirect'||[302,303,401].includes(r.status)){
      out.innerHTML='<div class="empty-state">Login required.</div>';btn.disabled=false;return;
    }
    if(!r.ok){
      let errText='HTTP '+r.status;
      try{const e=await r.clone().json();errText=e.error||errText;}catch(x){}
      out.innerHTML=`<div class="empty-state" style="color:#f85149">${escHtml(errText)}</div>`;
      btn.disabled=false;return;
    }
    const d=await r.json();
    if(!d.ok){
      out.innerHTML=`<div class="empty-state" style="color:#f85149">${escHtml(d.error||'Error')}</div>`;
      btn.disabled=false;return;
    }

    const perms=d.permissions||{};
    const missing=Object.entries(perms).filter(([,v])=>!v).map(([k])=>k);
    const criticalMissing=CRITICAL.filter(k=>!perms[k]);

    if(criticalMissing.length>0){
      autoLogIssue(`Bot missing critical permissions: ${criticalMissing.join(', ')}`,
        `Bot ${d.bot_tag} is missing: ${criticalMissing.join(', ')}`,
        'MISSING_PERMS',`/api/func-test/permissions/${sid}`,'critical');
    }

    let html='';
    if(d.is_administrator){
      html+=`<div class="admin-banner">&#x2605; Bot has Administrator — all permissions implied</div>`;
    }

    html+=`<div class="card">
      <div class="card-title">Bot Identity</div>
      <div class="kv-row"><span class="kv-key">Bot tag</span><span class="kv-val">${escHtml(d.bot_tag)}</span></div>
      <div class="kv-row"><span class="kv-key">Bot ID</span><span class="kv-val">${escHtml(d.bot_id)}</span></div>
      <div class="kv-row"><span class="kv-key">Computed permissions (raw)</span><span class="kv-val">${d.computed_permissions}</span></div>
      <div class="kv-row"><span class="kv-key">Missing permissions</span><span class="kv-val" style="color:${missing.length?'#f85149':'#56d364'}">${missing.length||'None'}</span></div>
    </div>`;

    html+=`<div class="card"><div class="card-title">Permission Details</div>
      <div class="perm-grid">
        ${Object.entries(perms).map(([k,v])=>{
          const critical=CRITICAL.includes(k);
          const label=PERM_LABELS[k]||k;
          return `<div class="perm-row ${(!v&&critical)?'perm-critical':''}">
            <span class="perm-name">${label}${critical?'<span style="color:#e3b341;font-size:.7rem;margin-left:4px">req</span>':''}</span>
            <span class="${v?'perm-ok':'perm-fail'}">${v?'✓':'✗'}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;

    out.innerHTML=html;
  }catch(e){
    out.innerHTML=`<div class="empty-state" style="color:#f85149">Error: ${escHtml(e.message)}</div>`;
  }
  btn.disabled=false;
}

function autoLogIssue(title,description,code,url,sev){
  const issues=JSON.parse(localStorage.getItem('stress_test_issues')||'[]');
  if(issues.find(i=>i.title===title&&i.url===url&&(Date.now()-new Date(i.created).getTime())<300000)) return;
  issues.unshift({id:Date.now()+Math.random(),title,severity:sev,area:'func-permissions',description,steps:'',code:String(code||''),url,created:new Date().toISOString(),auto:true});
  localStorage.setItem('stress_test_issues',JSON.stringify(issues));
}

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
loadServers();
</script>
</body>
</html>
