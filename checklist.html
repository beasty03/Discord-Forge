<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiscordForge — Checklist v2 (React SPA)</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1e2124;
    color: #dcddde;
    min-height: 100vh;
    padding: 32px 16px 64px;
  }

  .container { max-width: 900px; margin: 0 auto; }

  h1 { font-size: 26px; font-weight: 700; color: #fff; margin-bottom: 4px; }
  .subtitle { color: #72767d; font-size: 13px; margin-bottom: 6px; }
  .legend {
    display: flex; gap: 18px; font-size: 12px; margin-bottom: 24px; flex-wrap: wrap; color: #72767d;
  }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .dot-g { background: #57f287; }
  .dot-y { background: #faa61a; }
  .dot-r { background: #ed4245; }

  /* overall progress */
  .overall-bar {
    background: #2f3136;
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .overall-bar .label { color: #b9bbbe; font-size: 13px; white-space: nowrap; }
  .bar-wrap { flex: 1; min-width: 120px; background: #40444b; border-radius: 4px; height: 8px; overflow: hidden; }
  .bar-fill { height: 100%; background: #57f287; border-radius: 4px; transition: width .3s; }
  .overall-bar .pct { color: #57f287; font-weight: 700; font-size: 14px; white-space: nowrap; min-width: 38px; text-align: right; }
  .ctrl-btn {
    padding: 6px 14px;
    background: #4f545c;
    border: none;
    border-radius: 6px;
    color: #dcddde;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s;
  }
  .ctrl-btn:hover { background: #5865f2; color: #fff; }
  .ctrl-btn.danger:hover { background: #ed4245; }

  /* section */
  .section { background: #2f3136; border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 18px;
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid #40444b;
    gap: 12px;
  }
  .section-header:hover { background: #36393f; }
  .section-title { font-size: 14px; font-weight: 700; color: #fff; flex: 1; }
  .section-tag {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px;
    padding: 2px 7px; border-radius: 10px; white-space: nowrap;
  }
  .tag-fe  { background: rgba(88,101,242,.2); color: #7289da; }
  .tag-be  { background: rgba(87,242,135,.15); color: #57f287; }
  .tag-sec { background: rgba(237,66,69,.15); color: #ed4245; }
  .tag-ops { background: rgba(250,166,26,.15); color: #faa61a; }
  .section-progress { font-size: 12px; color: #72767d; white-space: nowrap; }
  .section-progress.done { color: #57f287; }
  .chevron { color: #72767d; font-size: 11px; transition: transform .2s; }
  .section.collapsed .chevron { transform: rotate(-90deg); }
  .section-body { padding: 8px 0; }
  .section.collapsed .section-body { display: none; }

  /* subsection */
  .subsection-label {
    padding: 10px 18px 4px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .7px;
    color: #72767d;
  }

  /* item row */
  .item-wrap { margin: 0 4px; border-radius: 6px; transition: background .1s; }
  .item-wrap:hover { background: #36393f; }
  .item-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 5px 10px 5px 18px;
    cursor: default;
  }
  .item-row input[type=checkbox] {
    margin-top: 3px; width: 15px; height: 15px; accent-color: #57f287; cursor: pointer; flex-shrink: 0;
  }
  .item-text { font-size: 13px; color: #dcddde; line-height: 1.5; flex: 1; cursor: pointer; user-select: none; }
  .item-wrap.checked .item-text { color: #57f287; text-decoration: line-through; opacity: .65; }
  .item-wrap.warn .item-text { color: #faa61a; }
  .item-wrap.warn.checked .item-text { color: #faa61a; opacity: .45; }
  .item-wrap.new-item .item-text::after {
    content: ' NEW'; font-size: 9px; font-weight: 700; color: #57f287; letter-spacing: .5px;
    background: rgba(87,242,135,.12); padding: 1px 5px; border-radius: 3px; margin-left: 6px; vertical-align: middle;
  }

  /* note button */
  .note-btn {
    background: none; border: none; cursor: pointer; padding: 2px 5px; border-radius: 4px;
    font-size: 12px; line-height: 1; color: #4f545c; opacity: 0;
    transition: opacity .15s, background .15s, color .15s; flex-shrink: 0; margin-top: 2px;
  }
  .item-wrap:hover .note-btn { opacity: 1; }
  .note-btn:hover { background: #40444b; color: #b9bbbe; }
  .note-btn.has-note { opacity: 1; color: #faa61a; }
  .note-btn.open { opacity: 1; color: #7289da; background: #40444b; }

  /* note area */
  .note-area { display: none; padding: 0 10px 8px 43px; }
  .note-area.open { display: block; }
  .note-area textarea {
    width: 100%; background: #1e2124; border: 1px solid #40444b; border-radius: 6px;
    color: #dcddde; font-size: 12px; font-family: inherit; padding: 7px 10px;
    resize: vertical; min-height: 52px; outline: none; line-height: 1.5;
    transition: border-color .15s;
  }
  .note-area textarea:focus { border-color: #7289da; }
  .note-area textarea::placeholder { color: #4f545c; }
  .note-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
  .note-saved { font-size: 11px; color: #57f287; opacity: 0; transition: opacity .3s; }
  .note-saved.show { opacity: 1; }
  .note-clear { font-size: 11px; color: #72767d; background: none; border: none; cursor: pointer; }
  .note-clear:hover { color: #ed4245; }

  code {
    background: #40444b; border-radius: 3px; padding: 1px 5px;
    font-size: 11px; font-family: 'Consolas', 'Courier New', monospace; color: #e3e5e8;
  }

  /* broken table */
  .broken-table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 13px; }
  .broken-table th {
    text-align: left; padding: 8px 12px; background: #40444b; color: #b9bbbe;
    font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
  }
  .broken-table td { padding: 8px 12px; border-bottom: 1px solid #40444b; vertical-align: top; }
  .broken-table td:first-child { color: #72767d; width: 24px; }
  .broken-table td:nth-child(2) { color: #faa61a; font-weight: 600; min-width: 200px; }
  .broken-table td:nth-child(3) { color: #b9bbbe; }
  .broken-table tr:last-child td { border-bottom: none; }
  .broken-wrap { padding: 12px 18px; }

  /* notes modal */
  #notesModal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75);
    z-index: 999; padding: 40px 16px; overflow-y: auto;
  }
  .modal-inner {
    max-width: 700px; margin: 0 auto; background: #2f3136; border-radius: 12px;
    padding: 28px 24px; position: relative;
  }
</style>
</head>
<body>
<div class="container">
  <h1>DiscordForge — Implementation Checklist</h1>
  <p class="subtitle">v2 · React SPA edition · Updated after Tier 1–3 + gap-filling sessions</p>
  <div class="legend">
    <span><span class="dot dot-g"></span> Check off when verified</span>
    <span><span class="dot dot-y"></span> Warning / partial / untested</span>
    <span><span class="dot dot-r"></span> Known broken / deferred</span>
    <span style="margin-left:auto;color:#5865f2;font-weight:600">NEW = added this session</span>
  </div>

  <div class="overall-bar">
    <span class="label">Overall progress</span>
    <div class="bar-wrap"><div class="bar-fill" id="globalBar" style="width:0%"></div></div>
    <span class="pct" id="globalPct">0%</span>
    <button class="ctrl-btn" onclick="showNotes()">📋 Notes</button>
    <button class="ctrl-btn danger" onclick="resetAll()">Reset all</button>
  </div>

  <!-- Notes modal -->
  <div id="notesModal">
    <div class="modal-inner">
      <button onclick="document.getElementById('notesModal').style.display='none'"
        style="position:absolute;top:14px;right:16px;background:#40444b;border:none;color:#b9bbbe;font-size:18px;cursor:pointer;border-radius:6px;width:32px;height:32px;line-height:1;">✕</button>
      <h2 style="color:#fff;font-size:18px;margin-bottom:16px;">Your notes</h2>
      <div id="notesContent"></div>
      <p id="notesEmpty" style="color:#72767d;font-size:13px;display:none;">No notes yet.</p>
    </div>
  </div>

  <div id="sections"></div>
</div>

// ── storage ────────────────────────────────────────────────────────────
const STORAGE_KEY = 'df_checklist_v2';
function load()   { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch { return {}; } }
function save(st) { localStorage.setItem(STORAGE_KEY, JSON.stringify(st)); }
function itemKey(s,i) { return `s${s}_i${i}`; }
function noteKey(s,i) { return `s${s}_i${i}_note`; }
let state = load();

// ── counts ────────────────────────────────────────────────────────────
function countItems(sIdx) {
  let total = 0, done = 0, iIdx = 0;
  DATA[sIdx].items.forEach(it => {
    if (it.t) { total++; if (state[itemKey(sIdx,iIdx)]) done++; }
    iIdx++;
  });
  return { total, done };
}
function globalCount() {
  let total = 0, done = 0;
  DATA.forEach((_,i) => { const c = countItems(i); total += c.total; done += c.done; });
  return { total, done };
}
function updateGlobal() {
  const { total, done } = globalCount();
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('globalBar').style.width = pct+'%';
  document.getElementById('globalPct').textContent = pct+'%';
}
function updateSection(sIdx) {
  const { total, done } = countItems(sIdx);
  const el = document.getElementById(`sp_${sIdx}`);
  if (!el) return;
  el.textContent = `${done} / ${total}`;
  el.className = 'section-progress' + (done===total && total>0 ? ' done' : '');
}

// ── checkbox toggle ───────────────────────────────────────────────────
function toggle(sIdx, iIdx, cb) {
  state[itemKey(sIdx,iIdx)] = cb.checked;
  save(state);
  cb.closest('.item-wrap').classList.toggle('checked', cb.checked);
  updateSection(sIdx);
  updateGlobal();
}

// ── note ──────────────────────────────────────────────────────────────
function toggleNote(btn, sIdx, iIdx) {
  const wrap = btn.closest('.item-wrap');
  const area = wrap.querySelector('.note-area');
  const open = area.classList.contains('open');
  area.classList.toggle('open', !open);
  btn.classList.toggle('open', !open);
  if (!open) wrap.querySelector('textarea').focus();
}
const saveTimers = {};
function onNoteInput(ta, sIdx, iIdx, savedEl, btn) {
  clearTimeout(saveTimers[`${sIdx}_${iIdx}`]);
  saveTimers[`${sIdx}_${iIdx}`] = setTimeout(() => {
    const val = ta.value.trim();
    if (val) state[noteKey(sIdx,iIdx)] = val; else delete state[noteKey(sIdx,iIdx)];
    save(state);
    btn.classList.toggle('has-note', !!val);
    savedEl.classList.add('show');
    setTimeout(() => savedEl.classList.remove('show'), 1400);
  }, 400);
}
function clearNote(sIdx, iIdx, btn, ta) {
  ta.value = ''; delete state[noteKey(sIdx,iIdx)]; save(state); btn.classList.remove('has-note');
}

// ── reset ─────────────────────────────────────────────────────────────
function resetAll() {
  if (!confirm('Reset all checkboxes and notes?')) return;
  state = {}; save(state);
  document.querySelectorAll('.item-wrap').forEach(w => {
    w.classList.remove('checked');
    const cb = w.querySelector('input[type=checkbox]');
    if (cb) cb.checked = false;
    const ta = w.querySelector('textarea');
    if (ta) ta.value = '';
    const nb = w.querySelector('.note-btn');
    if (nb) nb.classList.remove('has-note','open');
    const na = w.querySelector('.note-area');
    if (na) na.classList.remove('open');
  });
  DATA.forEach((_,i) => updateSection(i));
  updateGlobal();
}

// ── helpers ───────────────────────────────────────────────────────────
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(t) { return esc(t).replace(/`([^`]+)`/g,'<code>$1</code>'); }

// ── tag badge ─────────────────────────────────────────────────────────
const TAG_LABELS = { fe:'Frontend', be:'Backend', sec:'Security', ops:'Operations' };

// ── render ────────────────────────────────────────────────────────────
function render() {
  const container = document.getElementById('sections');

  DATA.forEach((section, sIdx) => {
    const secDiv = document.createElement('div');
    secDiv.className = 'section';

    const body = document.createElement('div');
    body.className = 'section-body';

    let iIdx = 0;
    section.items.forEach(it => {
      if (it.sub) {
        const lbl = document.createElement('div');
        lbl.className = 'subsection-label';
        lbl.textContent = it.sub;
        body.appendChild(lbl);
        iIdx++;
        return;
      }

      const key     = itemKey(sIdx,iIdx);
      const nKey    = noteKey(sIdx,iIdx);
      const checked = !!state[key];
      const noteVal = state[nKey] || '';
      const si = sIdx, ii = iIdx;

      const wrap = document.createElement('div');
      wrap.className = 'item-wrap' + (it.warn?'  warn':'') + (checked?' checked':'') + (it.isNew?' new-item':'');

      const row = document.createElement('div');
      row.className = 'item-row';

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = checked;
      cb.addEventListener('change', () => toggle(si, ii, cb));

      const span = document.createElement('span');
      span.className = 'item-text';
      span.innerHTML = fmt(it.t);
      span.addEventListener('click', () => { cb.checked = !cb.checked; toggle(si,ii,cb); });

      const noteBtn = document.createElement('button');
      noteBtn.className = 'note-btn' + (noteVal?' has-note':'');
      noteBtn.title = 'Add note';
      noteBtn.textContent = '✏️';
      noteBtn.addEventListener('click', e => { e.stopPropagation(); toggleNote(noteBtn,si,ii); });

      row.appendChild(cb); row.appendChild(span); row.appendChild(noteBtn);
      wrap.appendChild(row);

      const noteArea = document.createElement('div');
      noteArea.className = 'note-area';
      const ta = document.createElement('textarea');
      ta.placeholder = 'Note… (auto-saves)';
      ta.value = noteVal;
      const meta = document.createElement('div');
      meta.className = 'note-meta';
      const savedEl = document.createElement('span');
      savedEl.className = 'note-saved';
      savedEl.textContent = 'saved';
      const clearBtn = document.createElement('button');
      clearBtn.className = 'note-clear';
      clearBtn.textContent = 'Clear';
      clearBtn.addEventListener('click', () => clearNote(si,ii,noteBtn,ta));
      ta.addEventListener('input', () => onNoteInput(ta,si,ii,savedEl,noteBtn));
      meta.appendChild(savedEl); meta.appendChild(clearBtn);
      noteArea.appendChild(ta); noteArea.appendChild(meta);
      wrap.appendChild(noteArea);

      body.appendChild(wrap);
      iIdx++;
    });

    const { total, done } = countItems(sIdx);
    const doneClass = (done===total && total>0) ? ' done' : '';
    const tagLabel = TAG_LABELS[section.tag] || '';
    const tagClass = section.tag ? `section-tag tag-${section.tag}` : '';

    const header = document.createElement('div');
    header.className = 'section-header';
    header.innerHTML = `
      <span class="section-title">${esc(section.title)}</span>
      ${tagLabel ? `<span class="${tagClass}">${tagLabel}</span>` : ''}
      <span class="section-progress${doneClass}" id="sp_${sIdx}">${done} / ${total}</span>
      <span class="chevron">▼</span>`;
    header.addEventListener('click', () => secDiv.classList.toggle('collapsed'));

    secDiv.appendChild(header);
    secDiv.appendChild(body);
    container.appendChild(secDiv);
  });

  // Known broken (static table)
  const brokenDiv = document.createElement('div');
  brokenDiv.className = 'section';
  const rows = BROKEN.map((b,i) => `
    <tr>
      <td>${i+1}</td>
      <td>${esc(b.item)}</td>
      <td>${esc(b.notes)}</td>
    </tr>`).join('');
  brokenDiv.innerHTML = `
    <div class="section-header">
      <span class="section-title">24. Known Gaps / Not Yet Implemented</span>
      <span class="section-tag tag-ops">Backlog</span>
      <span class="section-progress" style="color:#faa61a">${BROKEN.length} items</span>
      <span class="chevron">▼</span>
    </div>
    <div class="section-body">
      <div class="broken-wrap">
        <table class="broken-table">
          <thead><tr><th>#</th><th>Item</th><th>Notes</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
  brokenDiv.querySelector('.section-header').addEventListener('click', () => brokenDiv.classList.toggle('collapsed'));
  container.appendChild(brokenDiv);

  updateGlobal();
}

render();

// ── notes modal ───────────────────────────────────────────────────────
function showNotes() {
  const content = document.getElementById('notesContent');
  const empty   = document.getElementById('notesEmpty');
  content.innerHTML = '';
  let found = false;
  DATA.forEach((section, sIdx) => {
    let html = '';
    let iIdx = 0;
    section.items.forEach(it => {
      if (it.t) {
        const val = state[noteKey(sIdx,iIdx)];
        if (val) {
          found = true;
          html += `<div style="margin-bottom:10px;padding:10px 12px;background:#36393f;border-radius:6px;border-left:3px solid #7289da;">
            <div style="color:#72767d;font-size:11px;margin-bottom:3px;">${esc(section.title)}</div>
            <div style="color:#dcddde;font-size:13px;margin-bottom:5px;">${esc(it.t)}</div>
            <div style="color:#faa61a;white-space:pre-wrap;font-size:13px;">${esc(val)}</div>
          </div>`;
        }
        iIdx++;
      } else { iIdx++; }
    });
    if (html) content.innerHTML += html;
  });
  empty.style.display   = found ? 'none'  : 'block';
  content.style.display = found ? 'block' : 'none';
  document.getElementById('notesModal').style.display = 'block';
}

document.getElementById('notesModal').addEventListener('click', e => {
  if (e.target === document.getElementById('notesModal'))
    document.getElementById('notesModal').style.display = 'none';
});
</script>
</body>
</html>
